services:
  jportfolio-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jportfolio-web
    environment:
      NODE_ENV: production
      PORT: "3000"
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portfolio.entrypoints=https"
      - "traefik.http.routers.portfolio.rule=( Host(`portfolio.local.jamesaproctor.com`) || Host(`portfolio.jamesaproctor.com`) )"
      # - "traefik.http.routers.portfolio.rule=( Host(`portfolio.east.jamesaproctor.com`) || Host(`portfolio.jamesaproctor.com`) )"
      # - "traefik.http.routers.portfolio.rule=( Host(`portfolio.pi.jamesaproctor.com`) || Host(`portfolio.jamesaproctor.com`) )"
      - "traefik.http.routers.portfolio.tls=true"
      - "traefik.docker.network=proxy"

networks:
  proxy:
    external: true
